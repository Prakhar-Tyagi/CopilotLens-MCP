<div class="listPanel system-scope-panel auto-list">
    <div class="titlebar auto-list-header">
        <span class="headingCount">
            <span class="headingCountNumber auto-item-count-label"><%= count %></span>
        </span>
        <span class="headerText auto-title-label"><%= title %></span>
    </div>
    <div class="listItem auto-item" data-scope="designs">
        <span class="tick"></span>
        <span class="mainText auto-title-label"><%= designsItemTitle %></span>
    </div>
    <div class="listItem auto-item" data-scope="diagrams">
        <span class="tick"></span>
        <span class="mainText auto-title-label"><%= diagramsItemTitle %></span>
    </div>
</div>
