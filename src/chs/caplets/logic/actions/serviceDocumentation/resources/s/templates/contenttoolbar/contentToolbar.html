<div class="toolbar background auto-toolbar">
	<% if(showDiagramBtn){ %>
	<div class="component-button diagrams-button auto-diagrams-button" customtooltiparraylength="1"
		 customtooltip-0="Select Diagrams" style="float: left; ">&nbsp;</div>
	<% } %>

	<% if(showReportBtn){ %>
	<div class="component-button reports-button auto-reports-button" customtooltiparraylength="1"
		 customtooltip-0="Select Reports" style="float: left;" title="">
		&nbsp;</div>
	<% } %>

	<% if(showObjectsBtn){ %>
	<div class="component-button related-data-button auto-related-data-button" customtooltiparraylength="1"
		 customtooltip-0="Related Data" style="float: left; ">&nbsp;</div>
	<% } %>
	<div class="component-button small-button restoreBtn auto-restore-button" customtooltiparraylength="1"
		 customtooltip-0="Restore"
		 style="float: right; display: none;">&nbsp;</div>
	<div class="component-button small-button maximizeBtn auto-maximize-button" customtooltiparraylength="1"
		 customtooltip-0="Maximize"
		 style="float: right; ">&nbsp;</div>
	<div class="component-button small-button closeBtn auto-close-button" customtooltiparraylength="1" customtooltip-0="Close"
		 style="float: right; ">&nbsp;</div>
	<div class="component-button small-button popOutBtn auto-pop-out-button" customtooltiparraylength="1"
		 customtooltip-0="Pop out"
		 style="float: right; ">&nbsp;
	</div>
	<div class="component-button small-button printBtn auto-print-button" customtooltiparraylength="1"
		 customtooltip-0="Print"
		 style="float: right;">&nbsp;
	</div>
	<div class="component-button languageBtn auto-language-button"
		 customtooltiparraylength="1" customtooltip-0="Language:EN">EN
	</div>
	<div class="component-label auto-title-label" title=""><%=title%></div>
	<img src="images/siemensWhiteLogo.svg"
		 class="SiemensWhiteLogo">
</div>
