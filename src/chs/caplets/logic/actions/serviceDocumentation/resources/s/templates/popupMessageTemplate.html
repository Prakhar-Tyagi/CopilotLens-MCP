<div id="detailPopup" class="iesdPopup auto-popover" style="display:block;height:230px;width:500px;">
	<div id="popupheader auto-popover-header" class="toolbar1">
		<div class="component-label auto-title-label" title=""><span style="font-size:14px;"><%=title%></span></div>
	</div>
	<div id="popover-grouped-list auto-popover-content" style="background-color:white;">
		<table cellpadding="5">
		<tr>
		<td rowspan="3" style="vertical-align:top;"><img src="images/error.png" width="45" height="45"></img></td>
		<td align="left"><span style="font-weight:bold;font-size:14px;" class="auto-message-label"><%=message%></span></td>
		</tr><tr>
		<td align="left"><span style="font-size:14px;" class="auto-implications-label"><%=implications%></span></td>
		</tr><tr>
		<td align="left"><span style="font-style:italic;font-size:14px;" class="auto-guidance-label"><%=guidance%></span></td>
		</tr>
		</table>
	</div>
	<div id="popupfooter auto-popover-footer" style="background-color:white;color:white;">
		<div style="vertical-align:bottom;"><span style="vertical-align:middle;font-size:14px;padding:5px 20px;background:black;border-radius: 5px 5px 5px 5px;"><%=button1%></span></div>
	</div>
</div>
