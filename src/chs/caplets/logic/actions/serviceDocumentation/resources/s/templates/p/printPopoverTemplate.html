<% if(show){ %>
<div id="detailPopup" class="iesdPopup auto-popover" style="display: block;height: 198px; left: <%=x%>px; top: <%=y%>px;">
	<div id="popupheader" class="toolbar1 auto-popover-header">
		<div class="component-label auto-title-label" title="" style="float: left;padding-left: 90px;"><%=title%></div>
		<div class="component-button small-button auto-print-button" id="toolbar_printbtn">&nbsp;</div>
		<div class="component-button small-button auto-close-button" id="toolbar_closebtn">&nbsp;</div>
	</div>
	<div id="popover-grouped-list" class="border auto-popover-content">
	</div>
	<div id="popupfooter" class="toolbar1 background auto-popover-footer">
	</div>
</div>
<% } %>
